_format_version: '2.1'
_transform: true
consumers:
- username: DASHBOARD
- username: anon
  keyauth_credentials:
  - key: $SUPABASE_ANON_KEY
  - key: $SUPABASE_PUBLISHABLE_KEY
- username: service_role
  keyauth_credentials:
  - key: $SUPABASE_SERVICE_KEY
  - key: $SUPABASE_SECRET_KEY
acls:
- consumer: anon
  group: anon
- consumer: service_role
  group: admin
basicauth_credentials:
- consumer: DASHBOARD
  username: $DASHBOARD_USERNAME
  password: $DASHBOARD_PASSWORD
services:
- name: auth-v1-open
  _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
  url: http://supabase-auth:9999/verify
  routes:
  - name: auth-v1-open
    strip_path: true
    paths:
    - /auth/v1/verify
  plugins:
  - name: cors
- name: auth-v1-open-callback
  _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
  url: http://supabase-auth:9999/callback
  routes:
  - name: auth-v1-open-callback
    strip_path: true
    paths:
    - /auth/v1/callback
  plugins:
  - name: cors
- name: auth-v1-open-authorize
  _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
  url: http://supabase-auth:9999/authorize
  routes:
  - name: auth-v1-open-authorize
    strip_path: true
    paths:
    - /auth/v1/authorize
  plugins:
  - name: cors
- name: auth-v1-open-jwks
  _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
  url: http://supabase-auth:9999/.well-known/jwks.json
  routes:
  - name: auth-v1-open-jwks
    strip_path: true
    paths:
    - /auth/v1/.well-known/jwks.json
  plugins:
  - name: cors
- name: auth-v1-open-well-known-oauth
  _comment: 'Auth: /auth/v1/.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
  url: http://supabase-auth:9999/.well-known/oauth-authorization-server
  routes:
  - name: auth-v1-open-well-known-oauth
    strip_path: true
    paths:
    - /auth/v1/.well-known/oauth-authorization-server
  plugins:
  - name: cors
- name: auth-v1-open-well-known-openid
  _comment: 'Auth: /auth/v1/.well-known/openid-configuration -> http://auth:9999/.well-known/openid-configuration'
  url: http://supabase-auth:9999/.well-known/openid-configuration
  routes:
  - name: auth-v1-open-well-known-openid
    strip_path: true
    paths:
    - /auth/v1/.well-known/openid-configuration
  plugins:
  - name: cors
- name: auth-v1-open-sso-acs
  url: http://supabase-auth:9999/sso/saml/acs
  routes:
  - name: auth-v1-open-sso-acs
    strip_path: true
    paths:
    - /auth/v1/sso/saml/acs
  plugins:
  - name: cors
- name: auth-v1-open-sso-metadata
  url: http://supabase-auth:9999/sso/saml/metadata
  routes:
  - name: auth-v1-open-sso-metadata
    strip_path: true
    paths:
    - /auth/v1/sso/saml/metadata
  plugins:
  - name: cors
- name: auth-v1
  _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
  url: http://supabase-auth:9999/
  routes:
  - name: auth-v1-all
    strip_path: true
    paths:
    - /auth/v1/
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
      replace:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: rest-v1-openapi
  _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
  url: http://supabase-rest:3000/
  routes:
  - name: rest-v1-openapi-root
    strip_path: true
    expression: http.path == "/rest/v1/"
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
      replace:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
- name: rest-v1
  _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
  url: http://supabase-rest:3000/
  routes:
  - name: rest-v1-all
    strip_path: true
    paths:
    - /rest/v1/
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
      replace:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: graphql-v1
  _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
  url: http://supabase-rest:3000/rpc/graphql
  routes:
  - name: graphql-v1-all
    strip_path: true
    paths:
    - /graphql/v1
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - 'Content-Profile: graphql_public'
        - "Authorization: $LUA_AUTH_EXPR"
      replace:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: realtime-v1-ws
  _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
  url: http://realtime-dev:4000/socket
  protocol: ws
  routes:
  - name: realtime-v1-ws
    strip_path: true
    paths:
    - /realtime/v1/
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - "x-api-key:$LUA_RT_WS_EXPR"
      replace:
        querystring:
        - "apikey:$LUA_RT_WS_EXPR"
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: realtime-v1-rest-openapi
  _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime-dev:4000/api/openapi/* (blocked)'
  url: http://realtime-dev:4000/api/openapi
  protocol: http
  routes:
  - name: realtime-v1-rest-openapi
    strip_path: true
    paths:
    - /realtime/v1/api/openapi
  plugins:
  - name: request-termination
    config:
      status_code: 403
      message: Access is forbidden.
- name: realtime-v1-rest-tenants
  _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime-dev:4000/api/tenants/* (blocked)'
  url: http://realtime-dev:4000/api/tenants
  protocol: http
  routes:
  - name: realtime-v1-rest-tenants
    strip_path: true
    paths:
    - /realtime/v1/api/tenants
  plugins:
  - name: request-termination
    config:
      status_code: 403
      message: Access is forbidden.
- name: realtime-v1-rest
  _comment: 'Realtime: /realtime/v1/api/* -> http://realtime-dev:4000/api/*'
  url: http://realtime-dev:4000/api
  protocol: http
  routes:
  - name: realtime-v1-rest
    strip_path: true
    paths:
    - /realtime/v1/api
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
      replace:
        headers:
        - "Authorization: $LUA_AUTH_EXPR"
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: storage-v1
  _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
  url: http://supabase-storage:5000/
  routes:
  - name: storage-v1-all
    strip_path: true
    paths:
    - /storage/v1/
    request_buffering: $KONG_STORAGE_REQUEST_BUFFERING
    response_buffering: $KONG_STORAGE_RESPONSE_BUFFERING
  plugins:
  - name: cors
  - name: post-function
    config:
      access:
      - |
        local apikey = kong.request.get_header("apikey")
        local auth = kong.request.get_header("authorization")
        local publishable_key = "$SUPABASE_PUBLISHABLE_KEY"
        local secret_key = "$SUPABASE_SECRET_KEY"
        local anon_key = "$SUPABASE_ANON_KEY"
        local service_key = "$SUPABASE_SERVICE_KEY"
        local function translated(key)
          if secret_key ~= "" and key == secret_key then return service_key end
          if publishable_key ~= "" and key == publishable_key then return anon_key end
          return nil
        end
        if auth == nil or auth == "" or auth:find("^%s*$") then
          local key = translated(apikey)
          if key ~= nil then
            kong.service.request.set_header("authorization", "Bearer " .. key)
          elseif apikey ~= nil and apikey ~= "" then
            kong.service.request.set_header("authorization", "Bearer " .. apikey)
          else
            kong.service.request.clear_header("authorization")
          end
        else
          local key = translated(auth:match("^[Bb]earer%s+(.+)$") or auth)
          if key ~= nil then kong.service.request.set_header("authorization", "Bearer " .. key) end
        end
  connect_timeout: $KONG_STORAGE_CONNECT_TIMEOUT
  write_timeout: $KONG_STORAGE_WRITE_TIMEOUT
  read_timeout: $KONG_STORAGE_READ_TIMEOUT
- name: functions-v1
  _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
  url: http://supabase-edge-functions:9000/
  read_timeout: 160000
  routes:
  - name: functions-v1-all
    strip_path: true
    paths:
    - /functions/v1/
  plugins:
  - name: cors
  - name: request-transformer
    config:
      remove:
        headers:
        - sb-api-key
      add:
        headers:
        - "sb-api-key:$LUA_FUNCTIONS_EXPR"
  - name: post-function
    config:
      access:
      - |
        local v = kong.request.get_header("sb-api-key")
        if v == nil or v == "" or v:find("^%s*$") then
          kong.service.request.clear_header("sb-api-key")
        end
- name: well-known-oauth
  _comment: 'Auth: /.well-known/oauth-authorization-server/auth/v1 -> http://auth:9999/.well-known/oauth-authorization-server'
  url: http://supabase-auth:9999/.well-known/oauth-authorization-server
  routes:
  - name: well-known-oauth
    strip_path: true
    paths:
    - /.well-known/oauth-authorization-server/auth/v1
  plugins:
  - name: cors
- name: meta
  _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
  url: http://supabase-meta:8080/
  routes:
  - name: meta-all
    strip_path: true
    paths:
    - /pg/
  plugins:
  - name: key-auth
    config:
      hide_credentials: false
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
- name: mcp-blocker
  _comment: Block direct access to /api/mcp
  url: http://supabase-studio:3000/api/mcp
  routes:
  - name: mcp-blocker-route
    strip_path: true
    paths:
    - /api/mcp
  plugins:
  - name: request-termination
    config:
      status_code: 403
      message: Access is forbidden.
- name: mcp
  _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
  url: http://supabase-studio:3000/api/mcp
  routes:
  - name: mcp
    strip_path: true
    paths:
    - /mcp
  plugins:
  - name: request-termination
    config:
      status_code: 403
      message: Access is forbidden.
- name: dashboard
  _comment: 'Studio: /* -> http://studio:3000/*'
  url: http://supabase-studio:3000/
  routes:
  - name: dashboard-all
    strip_path: true
    paths:
    - /
  plugins:
  - name: cors
  - name: basic-auth
    config:
      hide_credentials: true
